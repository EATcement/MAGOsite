<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="Atividade 10.css">
    <title>Seu mago</title>
</head>
<body>

    <form >
    <label> Nome de Mago:  </label>
    <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

    <p>
        1. Qual seu magia primaria? 
    </p>

    <input type="radio" id="Destrutiva" name="primaria" value="Destrutiva">
    <label> Destrutiva </label>
    <br>

    <input type="radio" id="Cura" name="primaria" value="Cura">
    <label> Cura </label>
    <br>

    <input type="radio" id="Conjuração" name="primaria" value="Conjuração">
    <label> Conjuração </label>
    <br>

    <input type="radio" id="Alquimia" name="primaria" value="Alquimia">
    <label> Alquimia </label>
    <br>

    <p>
        2. Meio de conjuração de magia?
    </p>

    <input type="radio" id="Varinha" name="magia" value="Varinha">
    <label> Varinha </label>
    <br>

    <input type="radio" id="Cajado" name="magia" value="Cajado">
    <label> Cajado </label>
    <br>

    <input type="radio" id="Mãos" name="magia" value="Mãos">
    <label> Mãos </label>
    <br>

    <p>
        3. Qual a sua inspiração de mago?
    </p>

    <input type="radio" id="Albus Dumbledore" name="mago" value="Albus Dumbledore">
    <label> Albus Dumbledore </label>
    <br>

    <input type="radio" id="Gandalf" name="mago" value="Gandalf">
    <label> Gandalf </label>
    <br>

    <input type="radio" id="Voldemort" name="mago" value="Voldemort">
    <label> Voldemort </label>
    <br>

    <input type="radio" id="Saruman" name="mago" value="Saruman">
    <label> Saruman </label>
    <br>

    <p>
        4. Qual seu familiar?
    </p>
    <input type="text" id="familiar" name="familiar" placeholder="Familiar">


    <p>
        5. Escolha seu elemento?
    </p>

    <input type="radio" id="Fogo" name="elemento" value="Fogo">
    <label> Fogo </label>
    <br>

    <input type="radio" id="Agua" name="elemento" value="Agua">
    <label> Água </label>
    <br>

    <input type="radio" id="Eletricidade" name="elemento" value="Eletricidade">
    <label> Eletricidade </label>
    <br>

    <input type="radio" id="Terra" name="elemento" value="Terra">
    <label> Terra </label>
    <br>

    <br>
    <input type="button" value="Enviar"> 
    <br>
    <img src="299px-Shaman-Idle.gif"alt="Imagem" class="mago">
    <img src="299px-Shaman-Idle.gif"alt="Imagem" class="mago2">


    </form>
    
</body>
</html>
